# 旁车从相邻车道切入自车道。数值在第 9 轮实例里，CARLA 生成器仍只用前两个模板。
template: vehicle_cut_in
description: 右侧车辆保持纵速，触发后以固定横向速度驶入自车道。
execution: kinematic
behavior:
  ego: hold_initial_speed
  target: cut_in_lateral
trigger:
  type: distance_to_target
map: Town10HD_Opt
fixed_delta_seconds: 0.05
timeout_s: 8.0
stop_speed_mps: 0.2
ego_s_m: 8.0
straight_length_m: 120.0
sample_step_m: 2.0
ego_blueprint: vehicle.lincoln.mkz_2020
target_blueprint: vehicle.tesla.model3
ego_box: {length_m: 4.90, width_m: 2.12, height_m: 1.51}
target_box: {length_m: 4.90, width_m: 2.12, height_m: 1.51}
lateral_m: 3.5
lateral_speed_mps: 2.0
speed_delta_mps: 3.0
cut_gap_m: 9.5
